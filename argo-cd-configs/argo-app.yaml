apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/SymulKabir/GitOps-infra.git
    path: apps/nginx
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
